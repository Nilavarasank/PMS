<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#f4f1ea"/>
  <text x="60" y="56" font-family="Trebuchet MS, sans-serif" font-size="28" fill="#10231f">Project Management System — Entity Relationship Diagram</text>
  <text x="60" y="86" font-family="Georgia, serif" font-size="16" fill="#5e746d">users 1—N projects 1—N tasks · ON DELETE CASCADE</text>

  <g transform="translate(60,130)">
    <rect width="300" height="280" rx="16" fill="#fffdf8" stroke="#10231f" stroke-width="2"/>
    <rect width="300" height="48" rx="16" fill="#0f6e62"/>
    <rect y="32" width="300" height="16" fill="#0f6e62"/>
    <text x="20" y="32" font-family="Trebuchet MS, sans-serif" font-size="20" fill="#fffdf8">users</text>
    <text x="20" y="84" font-family="Consolas, monospace" font-size="15" fill="#10231f">PK  id UUID</text>
    <text x="20" y="116" font-family="Consolas, monospace" font-size="15" fill="#10231f">    full_name VARCHAR(255)</text>
    <text x="20" y="148" font-family="Consolas, monospace" font-size="15" fill="#10231f">UQ  email VARCHAR(255)</text>
    <text x="20" y="180" font-family="Consolas, monospace" font-size="15" fill="#10231f">    password_hash VARCHAR</text>
    <text x="20" y="212" font-family="Consolas, monospace" font-size="15" fill="#10231f">    created_at TIMESTAMPTZ</text>
  </g>

  <g transform="translate(450,130)">
    <rect width="340" height="360" rx="16" fill="#fffdf8" stroke="#10231f" stroke-width="2"/>
    <rect width="340" height="48" rx="16" fill="#0f6e62"/>
    <rect y="32" width="340" height="16" fill="#0f6e62"/>
    <text x="20" y="32" font-family="Trebuchet MS, sans-serif" font-size="20" fill="#fffdf8">projects</text>
    <text x="20" y="84" font-family="Consolas, monospace" font-size="15" fill="#10231f">PK  id UUID</text>
    <text x="20" y="116" font-family="Consolas, monospace" font-size="15" fill="#10231f">FK  user_id → users.id</text>
    <text x="20" y="148" font-family="Consolas, monospace" font-size="15" fill="#10231f">    name VARCHAR(255)</text>
    <text x="20" y="180" font-family="Consolas, monospace" font-size="15" fill="#10231f">    description TEXT</text>
    <text x="20" y="212" font-family="Consolas, monospace" font-size="15" fill="#10231f">    status ENUM</text>
    <text x="20" y="244" font-family="Consolas, monospace" font-size="14" fill="#5e746d">        Not Started | In Progress | Completed</text>
    <text x="20" y="276" font-family="Consolas, monospace" font-size="15" fill="#10231f">    start_date DATE</text>
    <text x="20" y="308" font-family="Consolas, monospace" font-size="15" fill="#10231f">    end_date DATE</text>
    <text x="20" y="340" font-family="Consolas, monospace" font-size="15" fill="#10231f">    created_at TIMESTAMPTZ</text>
  </g>

  <g transform="translate(860,130)">
    <rect width="300" height="360" rx="16" fill="#fffdf8" stroke="#10231f" stroke-width="2"/>
    <rect width="300" height="48" rx="16" fill="#0f6e62"/>
    <rect y="32" width="300" height="16" fill="#0f6e62"/>
    <text x="20" y="32" font-family="Trebuchet MS, sans-serif" font-size="20" fill="#fffdf8">tasks</text>
    <text x="20" y="84" font-family="Consolas, monospace" font-size="15" fill="#10231f">PK  id UUID</text>
    <text x="20" y="116" font-family="Consolas, monospace" font-size="15" fill="#10231f">FK  project_id → projects.id</text>
    <text x="20" y="148" font-family="Consolas, monospace" font-size="15" fill="#10231f">    name VARCHAR(255)</text>
    <text x="20" y="180" font-family="Consolas, monospace" font-size="15" fill="#10231f">    description TEXT</text>
    <text x="20" y="212" font-family="Consolas, monospace" font-size="15" fill="#10231f">    priority ENUM Low|Med|High</text>
    <text x="20" y="244" font-family="Consolas, monospace" font-size="15" fill="#10231f">    status ENUM</text>
    <text x="20" y="276" font-family="Consolas, monospace" font-size="14" fill="#5e746d">        Pending | In Progress | Completed</text>
    <text x="20" y="308" font-family="Consolas, monospace" font-size="15" fill="#10231f">    due_date DATE</text>
    <text x="20" y="340" font-family="Consolas, monospace" font-size="15" fill="#10231f">    created_at TIMESTAMPTZ</text>
  </g>

  <line x1="360" y1="270" x2="450" y2="270" stroke="#0f6e62" stroke-width="3"/>
  <text x="372" y="256" font-family="Trebuchet MS, sans-serif" font-size="14" fill="#0f6e62">1      N</text>
  <line x1="790" y1="270" x2="860" y2="270" stroke="#0f6e62" stroke-width="3"/>
  <text x="802" y="256" font-family="Trebuchet MS, sans-serif" font-size="14" fill="#0f6e62">1     N</text>
  <text x="60" y="680" font-family="Georgia, serif" font-size="15" fill="#5e746d">Deleting a user deletes their projects. Deleting a project deletes its tasks.</text>
</svg>
