services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nila
      POSTGRES_PASSWORD: nila
      POSTGRES_DB: project_management
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nila -d project_management"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgres://nila:nila@postgres:5432/project_management
      JWT_SECRET: replace-with-a-long-random-secret
      JWT_EXPIRES_IN: 1h
      CORS_ORIGIN: http://localhost:5173
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:5000/api
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
